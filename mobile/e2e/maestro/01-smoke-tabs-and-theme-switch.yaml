appId: ke.co.kenyahub.app
name: "01 - All 5 Tabs Smoke & Atomic Light/Dark Theme Switch"
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "KenyaHub"
    timeout: 20000
- assertNotVisible: "Something went wrong"
- takeScreenshot: "01-home-initial"

# Walk all 5 bottom tabs
- tapOn: "Learn"
- extendedWaitUntil:
    visible: ".*Learn.*"
    timeout: 15000
- assertNotVisible: "Something went wrong"
- takeScreenshot: "01-learn-initial-theme"

# Toggle Light <-> Dark theme and verify atomic repaint (zero error boundary)
- tapOn:
    id: "theme-toggle"
    optional: true
- takeScreenshot: "01-learn-toggled-theme"
- assertNotVisible: "Something went wrong"

- tapOn: "Tools"
- extendedWaitUntil:
    visible: "All Tools"
    timeout: 15000
- assertNotVisible: "Something went wrong"
- takeScreenshot: "01-tools-tab"

- tapOn: "Counties"
- extendedWaitUntil:
    visible: "47 Counties Hub"
    timeout: 15000
- assertNotVisible: "Something went wrong"
- takeScreenshot: "01-counties-tab"

- tapOn: "Saved"
- extendedWaitUntil:
    visible: ".*Saved.*|.*Pinned.*"
    timeout: 15000
- assertNotVisible: "Something went wrong"
- takeScreenshot: "01-saved-tab"

- tapOn: "Home"
- extendedWaitUntil:
    visible: "KenyaHub"
    timeout: 15000
- assertNotVisible: "Something went wrong"
- takeScreenshot: "01-home-returned"
