appId: ke.co.kenyahub.app
name: "08 - Multi-Family Languages (Bantu, Nilotic, Cushitic) & Mini-Games Audit"
---
# 1. Bantu: Kiswahili (Vocab + Grammar + Wisdom)
- openLink: "kenyahub://learn?lang=swahili&tab=vocab"
- extendedWaitUntil:
    visible: ".*Kiswahili.*|.*Swahili.*"
    timeout: 12000
- assertNotVisible: "Something went wrong"
- takeScreenshot: "08-swahili-vocab"

- tapOn: "Grammar"
- assertNotVisible: "Something went wrong"
- takeScreenshot: "08-swahili-grammar"

# 2. Nilotic: Dholuo (Games -> Memory Cards)
- openLink: "kenyahub://learn?lang=luo&tab=games"
- extendedWaitUntil:
    visible: ".*Memory.*"
    timeout: 12000
- assertNotVisible: "Something went wrong"
- takeScreenshot: "08-luo-games"
- tapOn:
    text: "Memory Cards"
    optional: true
- assertNotVisible: "Something went wrong"
- takeScreenshot: "08-luo-memory-cards"

# 3. Cushitic: Borana (Start Lesson)
- openLink: "kenyahub://learn?lang=borana&tab=learn"
- extendedWaitUntil:
    visible: "Start Lesson"
    timeout: 12000
- assertNotVisible: "Something went wrong"
- takeScreenshot: "08-borana-path"
- tapOn: "Start Lesson"
- assertNotVisible: "Something went wrong"
- assertNotVisible: "Rendered fewer hooks"
- takeScreenshot: "08-borana-lesson-player"
