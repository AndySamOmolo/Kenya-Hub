appId: ke.co.kenyahub.app
name: "02 - Learn Courses, Lesson Player (No Hooks Crash) & Mini-Games"
---
- launchApp
- tapOn: "Learn"
- assertVisible: "Choose a Kenyan Language to Learn"

# Open Kikuyu course & verify fast load + zero crash
- tapOn: "Kikuyu"
- extendedWaitUntil:
    visible: "Start Lesson"
    timeout: 6000
- assertNotVisible: "Something went wrong"

# Launch Lesson Player (regression guard for Rules of Hooks crash)
- tapOn: "Start Lesson"
- assertNotVisible: "Something went wrong"
- assertNotVisible: "Rendered fewer hooks"
- takeScreenshot: "02-kikuyu-lesson-player"
- back

# Open Games tab and launch Word Scramble & Speed Match (regression guard for isSingleWordLexical & 'None' distractor)
- tapOn: "Games"
- assertVisible: "Word Scramble"
- tapOn: "Word Scramble"
- assertNotVisible: "Something went wrong"
- assertNotVisible: "isSingleWordLexical"
- takeScreenshot: "02-word-scramble"
- tapOn: "Games Menu"

- tapOn: "Speed Match"
- assertNotVisible: "Something went wrong"
- assertNotVisible: "None"
- takeScreenshot: "02-speed-match"
- tapOn: "Games Menu"

- tapOn: "Kikuyu Wordle"
- assertNotVisible: "Something went wrong"
- tapOn: "Games Menu"

# Return to Learn Hub and verify Resume CTA reflects last visited course (Kikuyu)
- back
- assertVisible: "Resume Kikuyu"
