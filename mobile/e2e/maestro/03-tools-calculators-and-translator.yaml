appId: ke.co.kenyahub.app
name: "03 - Flagship Tools Interactive Audit (Translator, M-Pesa, PAYE, KPLC, KCSE)"
---
# 1. 23-Language Translator & all mode tabs
- openLink: "kenyahub://tools/kenyan-translator"
- extendedWaitUntil:
    visible: "Translate"
    timeout: 15000
- assertVisible: "Browse"
- assertNotVisible: "Something went wrong"
- takeScreenshot: "03-translator-translate"
- tapOn: "Browse"
- assertNotVisible: "Something went wrong"
- takeScreenshot: "03-translator-browse"

# 2. M-Pesa Fee Calculator
- openLink: "kenyahub://tools/mpesa-fee-calculator"
- extendedWaitUntil:
    visible: ".*M-PESA.*|.*M-Pesa.*"
    timeout: 12000
- assertNotVisible: "Something went wrong"
- takeScreenshot: "03-mpesa-calculator"

# 3. PAYE & Net-to-Gross Calculator
- openLink: "kenyahub://tools/paye-calculator"
- extendedWaitUntil:
    visible: ".*PAYE.*|.*Salary.*|.*Gross.*"
    timeout: 12000
- assertNotVisible: "Something went wrong"
- takeScreenshot: "03-paye-calculator"

# 4. KCSE Grade Calculator
- openLink: "kenyahub://tools/kcse-grade-calculator"
- extendedWaitUntil:
    visible: ".*KCSE.*"
    timeout: 12000
- assertNotVisible: "Something went wrong"
- takeScreenshot: "03-kcse-calculator"

# 5. KPLC Token Calculator
- openLink: "kenyahub://tools/kplc-token-calculator"
- extendedWaitUntil:
    visible: ".*Token.*|.*KPLC.*|.*Purchase.*"
    timeout: 12000
- assertNotVisible: "Something went wrong"
- takeScreenshot: "03-kplc-calculator"

# 6. Water Bill Calculator
- openLink: "kenyahub://tools/water-bill-calculator"
- extendedWaitUntil:
    visible: ".*Water.*"
    timeout: 12000
- assertNotVisible: "Something went wrong"
- takeScreenshot: "03-water-bill-calculator"

# 7. Plate Decoder
- openLink: "kenyahub://tools/number-plate-decoder"
- extendedWaitUntil:
    visible: ".*Plate.*"
    timeout: 12000
- assertNotVisible: "Something went wrong"
- assertNotVisible: "White text on black"
- takeScreenshot: "03-plate-decoder"
