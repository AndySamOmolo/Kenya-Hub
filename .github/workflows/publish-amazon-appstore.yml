name: Publish Android APK (Amazon Appstore & GitHub)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Release versionName (e.g. 1.0.1 — leave blank to keep build.gradle)"
        required: false
        default: ""
        type: string
      version_code:
        description: "Integer versionCode (leave blank to auto-use GitHub run number + 10)"
        required: false
        default: ""
        type: string
      release_notes:
        description: "Release notes / Recent Changes for Amazon Appstore & GitHub"
        required: false
        default: "Updated Kenyan language courses, KSL studio, Swahili UI, and theme improvements."
        type: string
      publish_to_amazon_appstore:
        description: "Upload signed APK to Amazon Appstore (requires Amazon API secrets)"
        required: false
        default: true
        type: boolean
      submit_for_review:
        description: "Automatically commit & submit uploaded APK for Amazon Appstore review"
        required: false
        default: true
        type: boolean
      publish_github_release:
        description: "Also update GitHub Releases (latest) with this signed APK"
        required: false
        default: true
        type: boolean

concurrency:
  group: publish-amazon-appstore-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build Signed APK & Publish to Amazon Appstore
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Sync website courses & data into Android app
        working-directory: mobile
        run: node scripts/sync-data.mjs

      - name: Run strict mobile audit
        working-directory: mobile
        run: npm run audit:mobile:all

      - name: Bump Android versionCode & versionName for release
        env:
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - << 'PYEOF'
          import os, re
          from pathlib import Path

          gradle_path = Path("mobile/android/app/build.gradle")
          src = gradle_path.read_text(encoding="utf-8")

          raw_vc = os.environ.get("INPUT_VERSION_CODE", "").strip()
          import subprocess; vc = int(raw_vc) if raw_vc.isdigit() else (int(subprocess.check_output(["git", "rev-list", "--count", "HEAD"], text=True).strip()) + 500)
          src, n_vc = re.subn(r"versionCode\s+\d+", f"versionCode {vc}", src, count=1)
          assert n_vc == 1, "Could not update versionCode in build.gradle"

          raw_vn = os.environ.get("INPUT_VERSION_NAME", "").strip()
          if raw_vn:
              src, n_vn = re.subn(r'versionName\s+"[^"]+"', f'versionName "{raw_vn}"', src, count=1)
              assert n_vn == 1, "Could not update versionName in build.gradle"

          gradle_path.write_text(src, encoding="utf-8")
          print(f"Configured release build: versionCode={vc}, versionName={raw_vn or '(unchanged)'}")
          PYEOF

      - name: Decode Android Release Keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > mobile/android/app/release.keystore
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
            echo "Decoded release keystore successfully."
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is not set. Building with debug keystore."
          fi

      - name: Make gradlew executable
        working-directory: mobile/android
        run: chmod +x gradlew

      - name: Build Signed Android Release APK
        working-directory: mobile/android
        env:
          NODE_ENV: production
          NODE_OPTIONS: --max-old-space-size=4096
          MYAPP_UPLOAD_STORE_FILE: ${{ steps.keystore.outputs.has_keystore == 'true' && 'release.keystore' || '' }}
          MYAPP_UPLOAD_STORE_PASSWORD: ${{ secrets.MYAPP_UPLOAD_STORE_PASSWORD }}
          MYAPP_UPLOAD_KEY_ALIAS: ${{ secrets.MYAPP_UPLOAD_KEY_ALIAS }}
          MYAPP_UPLOAD_KEY_PASSWORD: ${{ secrets.MYAPP_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Copy release APK to workspace root
        run: cp mobile/android/app/build/outputs/apk/release/app-release.apk kenyahub-release.apk

      - name: Upload signed APK as GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: kenyahub-amazon-appstore-apk
          path: kenyahub-release.apk
          retention-days: 30

      - name: Publish signed APK to GitHub Releases (latest)
        if: ${{ inputs.publish_github_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest kenyahub-release.apk --clobber
            gh release edit latest --title "Latest Android APK" --notes "$RELEASE_NOTES" --latest
          else
            gh release create latest kenyahub-release.apk \
              --target "$GITHUB_SHA" \
              --title "Latest Android APK" \
              --notes "$RELEASE_NOTES" \
              --latest
          fi

      - name: Publish signed APK to Amazon Appstore
        if: ${{ inputs.publish_to_amazon_appstore }}
        env:
          AMAZON_CLIENT_ID: ${{ secrets.AMAZON_CLIENT_ID }}
          AMAZON_CLIENT_SECRET: ${{ secrets.AMAZON_CLIENT_SECRET }}
          AMAZON_APP_ID: ${{ secrets.AMAZON_APP_ID || vars.AMAZON_APP_ID }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          if [ "${{ steps.keystore.outputs.has_keystore }}" != "true" ]; then
            echo "::error::Cannot publish a debug-signed APK to Amazon Appstore. Add ANDROID_KEYSTORE_BASE64 and signing secrets first."
            exit 1
          fi
          if [ -z "$AMAZON_CLIENT_ID" ] || [ -z "$AMAZON_CLIENT_SECRET" ] || [ -z "$AMAZON_APP_ID" ]; then
            echo "::error::Missing AMAZON_CLIENT_ID, AMAZON_CLIENT_SECRET, or AMAZON_APP_ID secrets."
            exit 1
          fi
          python3 -m pip install --quiet requests
          COMMIT_FLAG=""
          if [ "${{ inputs.submit_for_review }}" = "true" ]; then
            COMMIT_FLAG="--commit"
          fi
          python3 -u mobile/scripts/publish-amazon-appstore.py \
            --apk kenyahub-release.apk \
            --release-notes "$RELEASE_NOTES" \
            $COMMIT_FLAG

      - name: Clean up temporary release keystore
        if: always()
        run: rm -f mobile/android/app/release.keystore
