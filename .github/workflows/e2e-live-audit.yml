name: Live E2E Web & Android App Audit

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Target Web URL (leave blank to audit local Next.js static build, or enter https://kenyahub.me)"
        required: false
        default: ""

jobs:
  web-static-and-playwright-audit:
    name: Web Static & Live Playwright Audit (Desktop & Mobile × Light & Dark)
    if: false # Disabled: Playwright and mobile photo/video audit disabled
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kenyahub/package-lock.json

      - name: Run Multi-Platform Static Audits & Core Test Suite
        run: |
          node kenyahub/scripts/audit-tools.mjs --strict
          node kenyahub/scripts/test-core-logic.mjs
          node mobile/scripts/audit-mobile-all.mjs --strict

      - name: Install Web Dependencies & Playwright Chromium
        working-directory: kenyahub
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium

      - name: Build Static Web App (when auditing local build)
        if: ${{ inputs.target_url == '' }}
        working-directory: kenyahub
        run: npm run build

      - name: Run Full Non-Stopping Playwright Live Audit
        working-directory: kenyahub
        continue-on-error: true
        env:
          BASE_URL: ${{ inputs.target_url || 'http://127.0.0.1:3000' }}
        run: npx playwright test

      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-full-audit-report
          path: kenyahub/reports/playwright-html/
          retention-days: 14

  android-live-e2e-audit:
    name: Android Emulator Exhaustive Live App Audit (All 33 Tools, 23 Languages, 47 Counties, Light+Dark, Videos)
    if: false # Disabled: Playwright and mobile photo/video audit disabled
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable KVM group permissions for fast Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Mobile Dependencies
        working-directory: mobile
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Sync Web Data & Run Mobile Static Audit
        working-directory: mobile
        run: |
          node scripts/sync-data.mjs
          node scripts/audit-mobile-all.mjs --strict

      - name: Build x86_64 Android Release APK for Emulator Live Audit
        working-directory: mobile/android
        env:
          NODE_ENV: production
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64
          unzip -l app/build/outputs/apk/release/app-release.apk | grep -q "lib/x86_64/" || (echo "ERROR: APK is missing x86_64 native libraries!" && exit 1)

      - name: Ensure FFmpeg & Install Maestro CLI
        run: |
          command -v ffmpeg >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Boot Android API 34 Emulator & Run Exhaustive Live Audit
        uses: reactivecircus/android-emulator-runner@v2
        continue-on-error: true
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 6G
          ram-size: 3072M
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            export PATH="$HOME/.maestro/bin:$PATH"
            adb shell svc power stayon true || true
            adb shell wm dismiss-keyguard || true
            adb shell input keyevent 82 || true
            adb install -r mobile/android/app/build/outputs/apk/release/app-release.apk
            node mobile/e2e/run-android-audit.mjs

      - name: Upload Exhaustive Android Audit Report, All Screenshots & MP4 Videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-live-audit-screenshots-and-videos
          path: |
            mobile/reports/android-live-audit.json
            mobile/reports/android-live-audit-summary.md
            mobile/reports/mobile-static-audit.json
            mobile/reports/screenshots
            mobile/reports/videos
          retention-days: 14
