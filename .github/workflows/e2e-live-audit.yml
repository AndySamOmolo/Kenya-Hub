name: Live E2E Web & Multi-Platform Audit

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Target URL (leave blank to audit local Next.js static build, or enter https://kenyahub.me)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "kenyahub/src/**"
      - "kenyahub/tests/**"
      - "kenyahub/scripts/**"
      - "mobile/src/**"
      - "mobile/app/**"

jobs:
  static-and-playwright-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kenyahub/package-lock.json

      - name: Run 74-Check Multi-Platform Audit & 14 Core Logic Suites
        run: |
          node kenyahub/scripts/audit-tools.mjs --strict
          node kenyahub/scripts/test-core-logic.mjs

      - name: Install Web Dependencies & Playwright Chromium
        working-directory: kenyahub
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build Static Web App (when auditing local build)
        if: ${{ inputs.target_url == '' }}
        working-directory: kenyahub
        run: npm run build

      - name: Run Playwright Live E2E Audit (Desktop & Mobile × Light & Dark)
        working-directory: kenyahub
        env:
          BASE_URL: ${{ inputs.target_url || 'http://127.0.0.1:3000' }}
        run: npx playwright test

      - name: Upload Playwright HTML & JSON Audit Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-live-audit-report
          path: |
            kenyahub/reports/playwright-html
            kenyahub/reports/playwright-audit.json
            kenyahub/reports/tool-audit.json
          retention-days: 14
