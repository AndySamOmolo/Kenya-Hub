name: Live E2E Web & Multi-Platform Audit

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Target URL (leave blank to audit local Next.js static build, or enter https://kenyahub.me)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "kenyahub/src/**"
      - "kenyahub/tests/**"
      - "kenyahub/scripts/**"
      - "mobile/src/**"
      - "mobile/app/**"

jobs:
  static-and-playwright-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kenyahub/package-lock.json

      - name: Run Multi-Platform Static Audits & Core Test Suite
        run: |
          node kenyahub/scripts/audit-tools.mjs --strict
          node kenyahub/scripts/test-core-logic.mjs
          node mobile/scripts/audit-mobile-all.mjs --strict

      - name: Install Web Dependencies & Playwright Chromium
        working-directory: kenyahub
        run: |
          npm ci
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium

      - name: Build Static Web App (when auditing local build)
        if: ${{ inputs.target_url == '' }}
        working-directory: kenyahub
        run: npm run build

      - name: Run Full Non-Stopping Playwright Live Audit (Desktop & Mobile × Light & Dark, Full Screenshots & Videos)
        working-directory: kenyahub
        continue-on-error: true
        env:
          BASE_URL: ${{ inputs.target_url || 'http://127.0.0.1:3000' }}
        run: npx playwright test

      - name: Upload Playwright HTML Report, JSON Audit, All Screenshots & Videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-full-audit-screenshots-and-videos
          path: |
            kenyahub/reports/playwright-html
            kenyahub/reports/playwright-audit.json
            kenyahub/reports/screenshots
            kenyahub/reports/tool-audit.json
            kenyahub/test-results
            mobile/reports/mobile-static-audit.json
          retention-days: 14
