name: Deploy Web & Build Android App

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-web:
    name: Build & Deploy Website (Cloudflare Pages)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      deployments: write

    defaults:
      run:
        working-directory: kenyahub

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kenyahub/package-lock.json

      - name: Remove deprecated tool route directories if present
        run: node scripts/clean-removed-tools.mjs

      - name: Install web dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Audit tools and modular courses
        run: npm run audit:tools:strict

      - name: Run core security and logic tests
        run: npm test

      - name: Build static web export
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          NEXT_PUBLIC_AUDIO_CDN_URL: ${{ secrets.NEXT_PUBLIC_AUDIO_CDN_URL }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name kenyahub
          workingDirectory: kenyahub

  build-android:
    name: Sync Course Data & Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Sync website courses & data into Android app
        working-directory: mobile
        run: node scripts/sync-data.mjs

      - name: Bump Android versionCode for release build
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - << 'PYEOF'
          import os, re
          from pathlib import Path
          gradle_path = Path("mobile/android/app/build.gradle")
          src = gradle_path.read_text(encoding="utf-8")
          import subprocess; vc = int(subprocess.check_output(["git", "rev-list", "--count", "HEAD"], text=True).strip()) + 500
          src, n = re.subn(r"versionCode\s+\d+", f"versionCode {vc}", src, count=1)
          assert n == 1, "Could not update versionCode"
          gradle_path.write_text(src, encoding="utf-8")
          print(f"Set release versionCode={vc}")
          PYEOF

      - name: Decode Android Release Keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > mobile/android/app/release.keystore
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
            echo "Decoded release keystore for signed APK build."
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set; falling back to debug keystore."
          fi

      - name: Make gradlew executable
        working-directory: mobile/android
        run: chmod +x gradlew

      - name: Build Signed Android Release APK
        working-directory: mobile/android
        env:
          NODE_ENV: production
          NODE_OPTIONS: --max-old-space-size=4096
          MYAPP_UPLOAD_STORE_FILE: ${{ steps.keystore.outputs.has_keystore == 'true' && 'release.keystore' || '' }}
          MYAPP_UPLOAD_STORE_PASSWORD: ${{ secrets.MYAPP_UPLOAD_STORE_PASSWORD }}
          MYAPP_UPLOAD_KEY_ALIAS: ${{ secrets.MYAPP_UPLOAD_KEY_ALIAS }}
          MYAPP_UPLOAD_KEY_PASSWORD: ${{ secrets.MYAPP_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Clean up temporary release keystore
        if: always()
        run: rm -f mobile/android/app/release.keystore

      - name: Copy APK to repository root
        run: cp mobile/android/app/build/outputs/apk/release/app-release.apk kenyahub-release.apk

      - name: Upload Android APK to latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest kenyahub-release.apk --clobber
            gh release edit latest --title "Latest Android APK" --latest
          else
            gh release create latest kenyahub-release.apk \
              --target "$GITHUB_SHA" \
              --title "Latest Android APK" \
              --notes "Automatically updated Android APK." \
              --latest
          fi

      - name: Commit synced mobile data to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- mobile/android/app/build.gradle || true
          git add mobile/src/shared
          if ! git diff --staged --quiet; then
            git commit -m "chore(mobile): sync web course data [skip ci]"
            for attempt in 1 2 3; do
              git fetch origin "${GITHUB_REF_NAME}"
              git rebase --autostash "origin/${GITHUB_REF_NAME}"
              if git push origin HEAD:"${GITHUB_REF_NAME}"; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::Failed to push synced mobile data after 3 attempts."
                exit 1
              fi
              echo "Push attempt ${attempt} failed; retrying in 5s..."
              sleep 5
            done
          else
            echo "No changes to mobile/src/shared"
          fi
