name: Deploy Web & Build Android App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-web:
    name: Build & Deploy Website (Cloudflare Pages)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    defaults:
      run:
        working-directory: kenyahub

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kenyahub/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build static web export
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name kenyahub
          workingDirectory: kenyahub

  build-android:
    name: Sync Course Data & Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Sync website courses & data into Android app
        working-directory: mobile
        run: npm run sync-data

      - name: Make gradlew executable
        working-directory: mobile/android
        run: chmod +x gradlew

      - name: Build Android Release APK
        working-directory: mobile/android
        env:
          NODE_ENV: production
        run: ./gradlew assembleRelease --no-daemon

      - name: Copy APK to repository root
        run: cp mobile/android/app/build/outputs/apk/release/app-release.apk kenyahub-release.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kenyahub-android-apk
          path: kenyahub-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Commit synced mobile data & updated APK to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/src/shared kenyahub-release.apk
          if ! git diff --staged --quiet; then
            git commit -m "chore(mobile): sync web course data and update Android release APK [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          else
            echo "No changes to mobile/src/shared or kenyahub-release.apk"
          fi
