name: Comprehensive Web & Android Zero-Error Audit

on:
  workflow_dispatch:
    inputs:
      run_web:
        description: "Run Web Typecheck, Lint, Core Tests & Full Playwright Audit (all 33 tools + core pages)"
        type: boolean
        default: true
      run_android:
        description: "Run Mobile Typecheck, x86_64 APK Build & Full Android Emulator Audit (all 33 tools + tabs, Light & Dark)"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web-comprehensive-audit:
    name: Web Zero-Error & Playwright Visual Audit
    if: false # Disabled: Playwright and mobile photo/video audit disabled
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: kenyahub

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kenyahub/package-lock.json

      - name: Remove deprecated tool route directories if present
        run: node scripts/clean-removed-tools.mjs

      - name: Install web dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Strict tool & course data audit
        run: npm run audit:tools:strict

      - name: Core security, logic & parity tests
        run: npm test

      - name: TypeScript typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run typecheck

      - name: ESLint check
        run: npm run lint

      - name: Build static web export
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          NEXT_PUBLIC_AUDIO_CDN_URL: ${{ secrets.NEXT_PUBLIC_AUDIO_CDN_URL }}
        run: npm run build

      - name: Install Playwright & Chromium
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium

      - name: Run exhaustive Playwright E2E, a11y, error & visual audit
        run: npx playwright test --config=playwright.config.mjs

      - name: Upload Web Playwright HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-playwright-audit
          path: kenyahub/reports/playwright-html/
          retention-days: 14

  android-comprehensive-audit:
    name: Android Zero-Error Emulator & Visual Audit
    if: false # Disabled: Playwright and mobile photo/video audit disabled
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Sync website courses & data into Android app
        working-directory: mobile
        run: node scripts/sync-data.mjs

      - name: Mobile TypeScript typecheck
        working-directory: mobile
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run typecheck

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android x86_64 Release APK for CI Emulator
        working-directory: mobile/android
        env:
          NODE_ENV: production
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=x86_64/' gradle.properties
          grep "^reactNativeArchitectures=" gradle.properties
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64
          echo "Verifying x86_64 native libraries inside APK..."
          unzip -l app/build/outputs/apk/release/app-release.apk | grep "lib/x86_64/" | head -n 5

      - name: Enable KVM for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot Android Emulator & run full 33-tool + core tabs visual & crash audit
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash mobile/scripts/android-visual-audit.sh

      - name: Upload Android Comprehensive Audit artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-visual-audit
          path: android-audit-artifacts/
          retention-days: 14
