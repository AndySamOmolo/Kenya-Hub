name: Audit tool data

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "kenyahub/src/app/tools/**"
      - "kenyahub/src/data/**"
      - "kenyahub/src/lib/tools-registry.ts"
      - "kenyahub/scripts/audit-tools.mjs"
      - "kenyahub/package.json"

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kenyahub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kenyahub/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run audit:tools:sources
      - run: npm run audit:tools:strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tool-data-audit
          path: kenyahub/reports/tool-audit.json
