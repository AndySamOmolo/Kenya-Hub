appId: ke.co.kenyahub.app
name: "05 - Home Explainers, Cushitic (Somali) Lesson Player & Tools Search"
---
# 1. Verify Home Practical Explainers renders cleanly
- openLink: "kenyahub://"
- extendedWaitUntil:
    visible: "KenyaHub"
    timeout: 15000
- scrollUntilVisible:
    element: ".*Practical Explainers.*"
    direction: DOWN
- assertNotVisible: "Something went wrong"
- takeScreenshot: "05-home-practical-explainers"

# 2. Cushitic (Somali) Lesson Player & Grammar/Wisdom tabs
- openLink: "kenyahub://learn?lang=somali&tab=learn"
- extendedWaitUntil:
    visible: "Start Lesson"
    timeout: 15000
- assertNotVisible: "Something went wrong"
- takeScreenshot: "05-somali-path"

- tapOn: "Start Lesson"
- assertNotVisible: "Something went wrong"
- assertNotVisible: "Rendered fewer hooks"
- takeScreenshot: "05-somali-lesson-player"
- back

- tapOn: "Grammar"
- assertNotVisible: "Something went wrong"
- takeScreenshot: "05-somali-grammar"

# 3. Tools Tab Search & Category Pills
- openLink: "kenyahub://tools"
- extendedWaitUntil:
    visible: "All Tools"
    timeout: 12000
- assertNotVisible: "Something went wrong"
- takeScreenshot: "05-tools-all-loaded"
