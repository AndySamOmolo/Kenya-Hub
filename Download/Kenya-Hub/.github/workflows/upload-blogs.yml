name: Sync Blogs to Appwrite

on:
  push:
    branches:
      - main
    paths:
      - 'kenyahub/src/data/blog-posts.ts'
      - 'kenyahub/scripts/upload-blogs.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Sync Static Blogs to Appwrite
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./kenyahub

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './kenyahub/package-lock.json'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Run Upload Script
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: |
          if [ -z "$APPWRITE_API_KEY" ]; then
            echo "::warning::APPWRITE_API_KEY secret not configured — skipping Appwrite blog sync."
            exit 0
          fi
          npx tsx scripts/upload-blogs.ts
